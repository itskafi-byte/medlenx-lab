# ---------------------------------------------------------------------------
# Every version here is pinned to a mutually-compatible set. If Android Studio
# offers upgrades, take them TOGETHER - AGP, Kotlin, KSP and Room must move as
# one unit or codegen breaks.
#
# Toolchain provenance: AGP / Kotlin / KSP / Room / Compose BOM / androidx and
# kotlinx versions are copied from Google's own android/nowinandroid sample
# (libs.versions.toml, last updated 2026-09-02), which is built with exactly
# this set. Gradle 9.7.1 is the newest stable tag on gradle/gradle and is the
# version nowinandroid's wrapper pins.
#
# WHY THIS SET: Gradle 9.1.0 is the first release that runs on a JVM 25 runtime
# (gradle/gradle compatibility.adoc), so the old 8.9 pin failed before any
# Kotlin was compiled on Android Studio's bundled JDK 25.
# ---------------------------------------------------------------------------
[versions]
agp = "9.3.2"
kotlin = "2.3.0"
ksp = "2.3.4"
coreKtx = "1.15.0"
lifecycle = "2.10.0"
activityCompose = "1.9.3"
composeBom = "2025.09.01"
navigationCompose = "2.8.5"
room = "2.8.3"
okhttp = "4.12.0"
serialization = "1.8.0"
coroutines = "1.10.1"
coil = "2.7.0"
datastore = "1.2.0"
exifinterface = "1.3.7"
osmdroid = "6.1.20"
haze = "1.7.3"          # newest stable in the 1.x line; 2.0 renames the whole API
junit = "4.13.2"
androidxJunit = "1.2.1"
espresso = "3.6.1"

